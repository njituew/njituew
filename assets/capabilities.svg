<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 264" width="920" height="264" role="img" aria-labelledby="t d"><title id="t">Capabilities</title><desc id="d">Five areas: backend REST APIs; AI agents and RAG; data scraping and analysis; DevOps and automation; microcontrollers and single-board computers.</desc><rect x="0.5" y="0.5" width="919" height="263" rx="14" fill="#0D141B" stroke="#1B2530"/><text x="26" y="34" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.9" fill="#E6EDF3">/ CAPABILITIES</text><text x="894" y="34" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" letter-spacing="1.5" fill="#5A7186" text-anchor="end">BACKEND · AI · DATA · DEVOPS · HARDWARE</text><line x1="26" y1="48.5" x2="894" y2="48.5" stroke="#1B2530"/><rect x="26" y="64" width="2" height="16" rx="1" fill="#14B8A6"/><text x="40" y="76" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#2dd4bf">BACKEND</text><text x="158" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.0" fill="#8FA9BE">REST API design and development, async Python, auth, clean project structure</text><line x1="26" y1="88.5" x2="894" y2="88.5" stroke="#16212C"/><rect x="26" y="104" width="2" height="16" rx="1" fill="#14B8A6"/><text x="40" y="116" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#2dd4bf">AI &amp; AGENTS</text><text x="158" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.0" fill="#8FA9BE">Telegram bots with LLM agents — RAG, vector search, tool calling, LangChain</text><line x1="26" y1="128.5" x2="894" y2="128.5" stroke="#16212C"/><rect x="26" y="144" width="2" height="16" rx="1" fill="#14B8A6"/><text x="40" y="156" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#2dd4bf">DATA</text><text x="158" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.0" fill="#8FA9BE">Scrapers and parsers, collection pipelines, Pandas and NumPy analysis</text><line x1="26" y1="168.5" x2="894" y2="168.5" stroke="#16212C"/><rect x="26" y="184" width="2" height="16" rx="1" fill="#14B8A6"/><text x="40" y="196" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#2dd4bf">DEVOPS</text><text x="158" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.0" fill="#8FA9BE">Docker deployments, Bash automation, Linux servers</text><line x1="26" y1="208.5" x2="894" y2="208.5" stroke="#16212C"/><rect x="26" y="224" width="2" height="16" rx="1" fill="#14B8A6"/><text x="40" y="236" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#2dd4bf">HARDWARE</text><text x="158" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.0" fill="#8FA9BE">Microcontrollers and single-board computers — Arduino, Raspberry Pi, PLD</text></svg>
